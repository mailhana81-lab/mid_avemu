<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ave Mujica 다섯 멤버의 인터랙티브 포스터"><title>Ave Mujica — UNVEIL</title><link rel="stylesheet" href="style.css"><script defer src="assets/gsap.min.js"></script><script defer src="script.js"></script></head>
<body><button id="arrival-gate" aria-label="화면을 눌러 저택을 바라보세요"><span>화면을 눌러 저택을 바라보세요</span><b aria-hidden="true">▸</b></button><main id="viewport"><div id="poster" aria-label="Ave Mujica 인터랙티브 포스터">
<div id="experience" inert><button id="back-stage" aria-label="캐릭터 선택 무대로 돌아가기"><img src="assets/backst-transparent.png" alt="Back Stage" draggable="false"></button><div class="background"><div class="diamonds"></div><div class="stage-edge"></div><div class="stage"></div></div>
<section id="masked" aria-label="Masked Oblivionis"><button id="unveil" aria-label="UnvEiL — 사키코의 가면 벗기기">UnvEiL?</button><div class="masked-motion"><img class="masked-character" src="assets/masked.png" alt="가면을 쓴 Oblivionis" draggable="false"></div><div class="identity"><div class="role">Keyboard</div><strong>Oblivionis</strong><span lang="ja">オブリビオニス</span></div></section>
<section id="revealed" aria-label="Sakiko Togawa" inert><div class="role">Keyboard</div><div class="alias">Oblivionis</div><h1>Sakiko Togawa</h1><div class="sakiko-motion"><img class="sakiko-character" src="assets/sakiko.png" alt="키보드 앞의 Sakiko Togawa" draggable="false"></div><div class="video-panel"><span class="video-label">VIDEO / MUSIC</span><span id="video-pending" hidden>영상 준비 중</span><iframe id="member-video" title="Ave Mujica 음악 영상" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="lyrics" aria-live="polite"><span class="sample-label">LYRICS / 日本語・한국어</span><div id="lyric-jp" lang="ja"></div><div id="lyric-ko"></div></div><button id="remask">↖ MASK AGAIN</button></section>
<div class="wipe wipe-white"></div><div class="wipe wipe-red"></div><div id="transition-word" aria-hidden="true">UnvEiL?</div>
</div>
<section id="mansion-scene" class="entry-scene" inert aria-label="달빛 아래 저택">
<img class="scene-image mansion-image" src="assets/mansion.png" alt="붉은 달 아래 아베무지카의 저택" draggable="false">
<div class="bats" aria-hidden="true"><span class="bat bat-0"><i></i></span><span class="bat bat-1"><i></i></span><span class="bat bat-2"><i></i></span><span class="bat bat-3"><i></i></span><span class="bat bat-4"><i></i></span><span class="bat bat-5"><i></i></span></div>
<button id="approach" aria-label="저택의 문으로 다가가기"><span>음악과 함께 입장하기 <b>▸</b></span></button></section>
<section id="door-scene" class="entry-scene" aria-label="저택의 문" inert>
<img class="scene-image" src="assets/door-open.png" alt="열린 저택의 문" draggable="false">
<div class="door-leaf left-leaf"></div><div class="door-leaf right-leaf"></div>
<img class="scene-image closed-facade" src="assets/door-closed.png" alt="닫힌 저택의 문" draggable="false">
<button id="welcome"><span class="welcome-triangle" aria-hidden="true">▶</span> 어서와, 아베무지카의 세계에.</button></section>
<section id="theater-scene" class="entry-scene" aria-label="캐릭터 선택 무대" inert>
<img class="scene-image" src="assets/pixel-theater-stage.png" alt="붉은 커튼이 드리운 픽셀 극장" draggable="false">
<div class="theater-logo" role="img" aria-label="Ave Mujica"></div>
<div id="soul-aura" aria-hidden="true"></div><div class="cast"><button class="member" data-member="0" aria-label="Oblivionis 선택" style="--member-x:340px"><img src="assets/04-center.png" alt="푸른 머리의 Oblivionis" draggable="false"></button><button class="member" data-member="1" aria-label="Timoris 선택" style="--member-x:570px"><img src="assets/01-upper-left.png" alt="검은 머리의 Timoris" draggable="false"></button><button class="member" data-member="2" aria-label="Doloris 선택" style="--member-x:800px"><img src="assets/03-lower-left.png" alt="주황 머리의 Doloris" draggable="false"></button><button class="member" data-member="3" aria-label="Amoris 선택" style="--member-x:1030px"><img src="assets/02-upper-right.png" alt="보라 머리의 Amoris" draggable="false"></button><button class="member" data-member="4" aria-label="Mortis 선택" style="--member-x:1260px"><img src="assets/05-right.png" alt="초록 머리의 Mortis" draggable="false"></button></div>
<p id="cast-status" role="status" aria-live="polite">인형을 선택해주세요.</p>
<div id="soul-white" aria-hidden="true"></div><div id="soul-loader" role="status" aria-live="polite"><p>영혼을 불어넣는중...</p><div id="soul-meter" role="progressbar" aria-label="영혼을 불어넣는 중" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="soul-fill"></div></div><span id="soul-percent" aria-hidden="true">0%</span></div>
</section>
<button id="bgm-toggle" hidden aria-label="배경음악 끄기" aria-pressed="true">♫ BGM ON</button></div></main><audio id="bgm" src="assets/ambience.mp3" preload="auto" loop></audio></body></html>
